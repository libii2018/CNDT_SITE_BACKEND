# Proxy du frontal CNDT vers l'application Laravel (conteneur "api").
# TOUT le site est servi par Laravel depuis le même domaine :
#   - le site vitrine (vues Blade, routes /…/*.html)
#   - le dashboard React (/admin/, build statique servi par Apache)
#   - l'API (/api/v1) et les fichiers uploadés (/storage/…)
# Aucune adresse http://… en dur nulle part : URLs relatives partout.

ServerName localhost

ProxyPreserveHost On
ProxyRequests Off

# Fichiers uploadés (disque "public" de Laravel) — explicite avant le /
ProxyPass        /storage/ http://api:80/storage/ retry=0
ProxyPassReverse /storage/ http://api:80/storage/

# Tout le reste → application Laravel (Blade + dashboard + API)
ProxyPass        /api/ http://api:80/api/ retry=0
ProxyPassReverse /api/ http://api:80/api/

ProxyPass        /  http://api:80/ retry=0
ProxyPassReverse /  http://api:80/
