# Proxy du frontal CNDT vers l'API Laravel (conteneur "api").
# Le site public (app.js), le dashboard (/admin) et le stockage
# (/storage/…) sont servis depuis le MÊME domaine : aucune adresse
# http://127.0.0.1:8000 en dur nulle part.

ServerName localhost

ProxyPreserveHost On
ProxyRequests Off

# API Laravel (routes préfixées api/v1 côté application)
ProxyPass        /api/    http://api:80/api/ retry=0
ProxyPassReverse /api/    http://api:80/api/

# Fichiers uploadés (disque "public" de Laravel)
ProxyPass        /storage/ http://api:80/storage/ retry=0
ProxyPassReverse /storage/ http://api:80/storage/

# Le reste du site (site.css, app.js, admin/, assets/…) est servi
# directement depuis /usr/local/apache2/htdocs.
